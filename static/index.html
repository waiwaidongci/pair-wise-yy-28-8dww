<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>影视拍摄连续性</title><style>
body{font:15px system-ui;max-width:1180px;margin:24px auto;padding:0 16px;background:#f3f4f7}
section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}
input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}
button{background:#4b2d6f;color:#fff;cursor:pointer}
pre{white-space:pre-wrap;max-height:420px;overflow:auto;background:#fafafa;padding:10px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}
.scene{border:1px solid #ccc;border-radius:8px;padding:10px;margin:10px 0}
.shot{border-left:4px solid #888;padding:8px 12px;margin:8px 0;background:#fafafa;border-radius:0 6px 6px 0}
.shot.locked{border-left-color:#2e7d32;background:#f0f7f0}
.shot.relock_pending{border-left-color:#c62828;background:#fdf3f2}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff;margin-left:6px}
.badge.locked{background:#2e7d32}.badge.relock_pending{background:#c62828}.badge.planned{background:#777}
table{border-collapse:collapse;width:100%;margin:6px 0}td,th{border:1px solid #ddd;padding:4px 8px;text-align:left;font-size:13px}
.conflict{background:#fff5f5;border-left:4px solid #c62828;padding:6px 10px;margin:6px 0;font-size:13px}
.muted{color:#666;font-size:12px}
</style><h1>影视拍摄连续性管理</h1>

<section><h2>连续性报告（只依据每镜头最新启用版本）</h2>
<input id="production" type="number" placeholder="项目 ID"><button onclick="report()">查看报告</button>
<div id="report"></div></section>

<section><h2>补拍版本提交与锁定</h2>
<div class="grid">
<input id="scene" type="number" placeholder="场次 ID">
<input id="shot" type="number" placeholder="镜头 ID">
<input id="element" type="number" placeholder="元素 ID">
<input id="user" type="number" placeholder="场记/制片 ID">
<input id="value" placeholder="状态值">
<input id="numeric" type="number" step="0.1" placeholder="数值（单调规则必填）">
<input id="shootdate" type="date" placeholder="拍摄日">
<input id="reason" placeholder="替换原因（必填）">
</div>
<button onclick="state()">提交新版本（版本号自动递增）</button>
<button onclick="check()">重新检查场次</button>
<button onclick="lock()">锁定镜头（绑定当前版本）</button>
<button onclick="versions()">查看镜头版本历史</button>
<button onclick="shotLocks()">查看镜头锁定历史</button>
<pre id="result"></pre></section>

<section><h2>调整方案（审核期间冻结新版本）</h2>
<input id="conflict" type="number" placeholder="冲突 ID">
<input id="newvalue" placeholder="新状态">
<input id="newnumeric" type="number" step="0.1" placeholder="新数值">
<input id="planshootdate" type="date" title="方案生效拍摄日">
<input id="reviewer" type="number" placeholder="审片人 ID">
<input id="plan" type="number" placeholder="方案 ID">
<button onclick="propose()">提出方案</button>
<button onclick="approve()">批准方案（通过后生成版本）</button>
<button onclick="reject()">驳回方案</button>
<button onclick="exempt()">批准豁免</button>
<pre id="extra"></pre></section>

<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);
async function get(u,e='#result'){show(e,await(await fetch(u)).json())}
async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}
const STATUS_LABEL={planned:'待锁定',locked:'已锁定',relock_pending:'待重新锁定'};

function state(){post('/api/shots/'+shot.value+'/states',{element_id:+element.value,state_value:value.value,numeric_value:numeric.value?+numeric.value:null,shoot_date:shootdate.value,reason:reason.value,user_id:+user.value})}
function check(){post('/api/scenes/'+scene.value+'/check',{})}
function lock(){post('/api/shots/'+shot.value+'/lock',{user_id:+user.value})}
function versions(){get('/api/shots/'+shot.value+'/versions')}
function shotLocks(){get('/api/shots/'+shot.value+'/locks')}
function exempt(){post('/api/conflicts/'+conflict.value+'/exemptions',{reason:reason.value,reviewer_id:+reviewer.value},'#extra')}
function propose(){post('/api/conflicts/'+conflict.value+'/plans',{new_value:newvalue.value,numeric_value:newnumeric.value?+newnumeric.value:null,shoot_date:planshootdate.value,reason:reason.value,user_id:+user.value},'#extra')}
function approve(){post('/api/plans/'+plan.value+'/review',{approve:true,reviewer_id:+reviewer.value,note:reason.value},'#extra')}
function reject(){post('/api/plans/'+plan.value+'/review',{approve:false,reviewer_id:+reviewer.value,note:reason.value},'#extra')}

async function report(){
 const r=await(await fetch('/api/productions/'+production.value+'/continuity')).json();
 if(r.error){document.querySelector('#report').innerHTML='<pre>'+esc(r.error)+'</pre>';return}
 let h=`<h3>${esc(r.production.title)} <span class="muted">开放冲突 ${r.open_conflicts} · 已豁免 ${r.exempted_conflicts}</span></h3>`;
 for(const sc of r.scenes){
  h+=`<div class="scene"><h4>场次 ${esc(sc.scene_number)} ${esc(sc.title)} <span class="muted">叙事顺序 ${sc.narrative_order}</span></h4>`;
  for(const s of sc.shots){
   h+=`<div class="shot ${s.status}"><b>${esc(s.shot_code)}</b> v${s.version}
     <span class="badge ${s.status}">${STATUS_LABEL[s.status]||s.status}</span>
     <span class="muted">拍摄序 ${s.shoot_order} · 叙事序 ${s.narrative_order}</span>`;
   if(s.relock_reason)h+=`<div class="muted">退回原因：${esc(s.relock_reason)}</div>`;
   if(s.states.length){
    h+='<table><tr><th>元素</th><th>状态</th><th>数值</th><th>拍摄日</th><th>依据版本</th><th>操作人</th><th>替换原因</th></tr>';
    for(const v of s.states)h+=`<tr><td>${esc(v.element_name)}</td><td>${esc(v.state_value)}</td><td>${v.numeric_value??''}</td><td>${esc(v.shoot_date)}</td><td><b>v${v.version}</b></td><td>${esc(v.submitted_by_name)}</td><td>${esc(v.reason)}</td></tr>`;
    h+='</table>';
   }
   const active=(s.locks||[]).filter(l=>!l.released_at);
   const old=(s.locks||[]).filter(l=>l.released_at);
   if(active.length)h+=`<div>🔒 当前锁定绑定版本：<b>v${active[0].version}</b> <span class="muted">${esc(active[0].locked_by_name)} @ ${esc(active[0].locked_at)}</span></div>`;
   if(old.length)h+=`<div class="muted">历史锁定：${old.map(l=>`v${l.version}（已作废：${esc(l.release_reason||'')}）`).join('；')}</div>`;
   h+='</div>';
  }
  for(const c of sc.conflicts){
   const color=c.active?(c.status==='exempted'?'#f0f7f0':'#fff5f5'):'#f5f5f5';
   h+=`<div class="conflict" style="background:${color};border-left-color:${c.active&&c.status!=='exempted'?'#c62828':'#999'}">
     ${c.active?'':'【已解决】'}${c.status==='exempted'?'【已豁免】':''}${esc(c.detail)}
     <br><span class="muted">依据版本：${esc(c.from_shot_code)} v${c.from_version??'?'} → ${esc(c.to_shot_code)} v${c.to_version??'?'}</span></div>`;
  }
  h+='</div>';
 }
 document.querySelector('#report').innerHTML=h;
}
report();
</script></html>
